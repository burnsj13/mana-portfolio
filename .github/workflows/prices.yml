name: Update prices and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 10,22 * * *'
  workflow_dispatch:
    inputs:
      discord_snapshot:
        description: Send graph summaries to configured Discord channels now
        type: boolean
        default: false
      backfill:
        description: Import available archived history for both separate collections
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: portfolio
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate archive retention
        run: |
          python -m unittest discover -s tests
          node tests/test_market.cjs
      - name: Historical import
        if: inputs.backfill
        run: |
          pip install ijson
          python scripts/update_prices.py --backfill
          python scripts/update_prices.py --collection jacob --backfill
      - name: Update main collection
        run: python scripts/update_prices.py
      - name: Update Jacob collection
        run: python scripts/update_prices.py --collection jacob
      - name: Install graph renderer
        run: pip install Pillow
      - name: Main Discord alerts and graph
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_MAIN: ${{ secrets.DISCORD_WEBHOOK_MAIN }}
        run: python scripts/check_alerts.py ${{ inputs.discord_snapshot && '--send-summary' || '' }}
      - name: Jacob Discord alerts and graph
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_JACOB: ${{ secrets.DISCORD_WEBHOOK_JACOB }}
        run: python scripts/check_alerts.py --collection jacob ${{ inputs.discord_snapshot && '--send-summary' || '' }}
      - name: Commit observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update collection price snapshots'
            git push
          fi
      - name: Prepare public site
        run: |
          mkdir _site
          cp index.html jacob.html app.js market.js insights.js styles.css _site/
          cp -r settings _site/
          cp -r data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
