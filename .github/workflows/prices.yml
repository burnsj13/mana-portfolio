name: Update prices and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 10,22 * * *'
  workflow_dispatch:
    inputs:
      discord_snapshot:
        description: Send graph summaries to configured Discord channels now
        type: boolean
        default: false
      discord_collection:
        description: Collection to include in the manual Discord graph test
        type: choice
        options: [both, main, jacob]
        default: both
      backfill:
        description: Import available archived history for both separate collections
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate archive retention
        run: |
          python -m unittest discover -s tests
          node tests/test_market.cjs
          node tests/test_github_settings.cjs
          node tests/test_supabase.cjs
          npm install --prefix work/sql-test --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.10
          node tests/test_supabase_rls.cjs
      - name: Import existing holdings into Supabase once
        run: |
          python scripts/supabase_sync.py --bootstrap
          python scripts/supabase_sync.py --restore
      - name: Historical import
        if: inputs.backfill
        run: |
          pip install ijson
          python scripts/update_prices.py --backfill
          python scripts/update_prices.py --collection jacob --backfill
      - name: Update main collection
        run: python scripts/update_prices.py
      - name: Update Jacob collection
        run: python scripts/update_prices.py --collection jacob
      - name: Install graph renderer
        run: pip install Pillow
      - name: Main Discord alerts and graph
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_MAIN: ${{ secrets.DISCORD_WEBHOOK_MAIN }}
        run: python scripts/check_alerts.py ${{ inputs.discord_snapshot && (inputs.discord_collection == 'both' || inputs.discord_collection == 'main') && '--send-summary' || '' }}
      - name: Jacob Discord alerts and graph
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_JACOB: ${{ secrets.DISCORD_WEBHOOK_JACOB }}
        run: python scripts/check_alerts.py --collection jacob ${{ inputs.discord_snapshot && (inputs.discord_collection == 'both' || inputs.discord_collection == 'jacob') && '--send-summary' || '' }}
      - name: Prepare public site
        run: |
          python scripts/supabase_sync.py
          mkdir _site
          cp index.html jacob.html app.js market.js insights.js github-settings.js github-settings-ui.js supabase-client.js supabase-ui.js supabase-config.json styles.css _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
